<script>
/* If the app has not started after 10s (blocked script, very slow network), show a way out instead of an endless spinner. */
setTimeout(function(){var a=document.getElementById('app');if(a&&a.querySelector('.boot')){a.innerHTML='<div style="max-width:360px;margin:20vh auto;padding:0 20px;text-align:center;font:15px system-ui,sans-serif"><b style="font-size:18px">Gully Live could not start</b><p style="opacity:.7">Check your connection and try again. Your saved matches are safe on this device.</p><button onclick="location.reload()" style="border:0;border-radius:14px;padding:13px 22px;font:700 15px system-ui,sans-serif;background:#2ee6c5;color:#03121a;cursor:pointer">Reload</button></div>'}},10000);
</script>
